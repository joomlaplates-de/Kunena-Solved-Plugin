; Kunena Plugin - Solved
; Note : All ini files need to be saved as UTF-8 - No BOM

PLG_KUNENA_SOLVED="Kunena - Gelöst"
PLG_KUNENA_SOLVED_XML_DESCRIPTION="Thema-Ersteller, Moderatoren und Administratoren können ein Kunena-Thema als gelöst markieren. Der Titel erhält ein Präfix, das Themen-Icon wird auf „Gelöst“ gesetzt; optional wird ein Hinweis-Beitrag angehängt und das Thema gesperrt."

PLG_KUNENA_SOLVED_ALLOW_AUTHOR="Thema-Ersteller darf markieren"
PLG_KUNENA_SOLVED_ALLOW_AUTHOR_DESC="Der Ersteller eines Themas sieht den Button „Als gelöst markieren“ in seinem eigenen Thema."
PLG_KUNENA_SOLVED_ALLOW_MODERATOR="Moderatoren dürfen markieren"
PLG_KUNENA_SOLVED_ALLOW_MODERATOR_DESC="Moderatoren der jeweiligen Kategorie sehen den Button in allen Themen."
PLG_KUNENA_SOLVED_ALLOW_ADMIN="Administratoren dürfen markieren"
PLG_KUNENA_SOLVED_ALLOW_ADMIN_DESC="Kunena-Administratoren sehen den Button in allen Themen."
PLG_KUNENA_SOLVED_PREFIX="Titel-Präfix"
PLG_KUNENA_SOLVED_PREFIX_DESC="Text, der vor den Thementitel gesetzt wird. Leer lassen für den Standard aus der Sprachdatei. Bei mehrsprachigen Seiten hier einen festen Text eintragen, damit gelöste Themen in jeder Sprache erkannt werden."
PLG_KUNENA_SOLVED_PREFIX_DEFAULT="[Gelöst]"
PLG_KUNENA_SOLVED_SET_ICON="Themen-Icon setzen"
PLG_KUNENA_SOLVED_SET_ICON_DESC="Setzt beim Markieren das Kunena-Themen-Icon „Gelöst“ (grüner Haken). Beim Zurücknehmen wird es auf das Standard-Icon zurückgesetzt. Themen-Icons müssen in der Kunena-Konfiguration aktiviert sein."
PLG_KUNENA_SOLVED_ICON_ID="Icon-ID"
PLG_KUNENA_SOLVED_ICON_ID_DESC="ID des Themen-Icons im Kunena-Iconset. Im Standard-Iconset ist 8 = „solved“."
PLG_KUNENA_SOLVED_POST_NOTICE="Hinweis-Beitrag anhängen"
PLG_KUNENA_SOLVED_POST_NOTICE_DESC="Beim Markieren wird automatisch ein kurzer Beitrag im Namen des markierenden Benutzers angehängt."
PLG_KUNENA_SOLVED_NOTICE_TEXT="Text des Hinweis-Beitrags"
PLG_KUNENA_SOLVED_NOTICE_TEXT_DESC="BBCode ist erlaubt. Leer lassen für den Standardtext."
PLG_KUNENA_SOLVED_NOTICE_DEFAULT="[b]Dieses Thema wurde als gelöst markiert.[/b]"
PLG_KUNENA_SOLVED_LOCK_TOPIC="Thema sperren"
PLG_KUNENA_SOLVED_LOCK_TOPIC_DESC="Sperrt das Thema beim Markieren (keine neuen Antworten). Beim Zurücknehmen wird es wieder entsperrt."

PLG_KUNENA_SOLVED_BUTTON_SOLVE="Als gelöst markieren"
PLG_KUNENA_SOLVED_BUTTON_UNSOLVE="Als ungelöst markieren"
PLG_KUNENA_SOLVED_MARKED="Das Thema wurde als gelöst markiert."
PLG_KUNENA_SOLVED_UNMARKED="Die Markierung „Gelöst“ wurde entfernt."
PLG_KUNENA_SOLVED_NOT_ALLOWED="Sie dürfen dieses Thema nicht als gelöst markieren."
