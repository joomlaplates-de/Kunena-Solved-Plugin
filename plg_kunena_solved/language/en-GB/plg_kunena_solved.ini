; Kunena Plugin - Solved
; Note : All ini files need to be saved as UTF-8 - No BOM

PLG_KUNENA_SOLVED="Kunena - Solved"
PLG_KUNENA_SOLVED_XML_DESCRIPTION="Lets topic authors, moderators and administrators mark a Kunena topic as solved. The title gets a prefix and the topic icon is set to \"solved\"; optionally a notice post is added and the topic is locked."

PLG_KUNENA_SOLVED_ALLOW_AUTHOR="Topic author may mark"
PLG_KUNENA_SOLVED_ALLOW_AUTHOR_DESC="The author of a topic sees the \"Mark as solved\" button in their own topic."
PLG_KUNENA_SOLVED_ALLOW_MODERATOR="Moderators may mark"
PLG_KUNENA_SOLVED_ALLOW_MODERATOR_DESC="Moderators of the category see the button in all topics."
PLG_KUNENA_SOLVED_ALLOW_ADMIN="Administrators may mark"
PLG_KUNENA_SOLVED_ALLOW_ADMIN_DESC="Kunena administrators see the button in all topics."
PLG_KUNENA_SOLVED_PREFIX="Title prefix"
PLG_KUNENA_SOLVED_PREFIX_DESC="Text placed in front of the topic title. Leave empty to use the language default. On multilingual sites enter a fixed text here so solved topics are recognised in every language."
PLG_KUNENA_SOLVED_PREFIX_DEFAULT="[Solved]"
PLG_KUNENA_SOLVED_SET_ICON="Set topic icon"
PLG_KUNENA_SOLVED_SET_ICON_DESC="Sets the Kunena topic icon \"solved\" (green check). When unmarking, it is reset to the default icon. Topic icons must be enabled in the Kunena configuration."
PLG_KUNENA_SOLVED_ICON_ID="Icon ID"
PLG_KUNENA_SOLVED_ICON_ID_DESC="ID of the topic icon in the Kunena icon set. In the default set 8 = \"solved\"."
PLG_KUNENA_SOLVED_POST_NOTICE="Add notice post"
PLG_KUNENA_SOLVED_POST_NOTICE_DESC="Automatically adds a short post in the name of the user who marks the topic."
PLG_KUNENA_SOLVED_NOTICE_TEXT="Notice post text"
PLG_KUNENA_SOLVED_NOTICE_TEXT_DESC="BBCode is allowed. Leave empty for the default text."
PLG_KUNENA_SOLVED_NOTICE_DEFAULT="[b]This topic has been marked as solved.[/b]"
PLG_KUNENA_SOLVED_LOCK_TOPIC="Lock topic"
PLG_KUNENA_SOLVED_LOCK_TOPIC_DESC="Locks the topic when it is marked as solved (no new replies). Unmarking unlocks it again."

PLG_KUNENA_SOLVED_BUTTON_SOLVE="Mark as solved"
PLG_KUNENA_SOLVED_BUTTON_UNSOLVE="Mark as unsolved"
PLG_KUNENA_SOLVED_MARKED="The topic has been marked as solved."
PLG_KUNENA_SOLVED_UNMARKED="The solved mark has been removed."
PLG_KUNENA_SOLVED_NOT_ALLOWED="You are not allowed to mark this topic as solved."
